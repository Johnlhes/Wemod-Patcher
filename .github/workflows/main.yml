name: Build executable

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            base-devel

      - name: Build CMake helper DLL with MinGW
        shell: msys2 {0}
        run: |
          cmake -S tools/asar-fuses-bypass -B tools/asar-fuses-bypass/cmake-build-release -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/asar-fuses-bypass/cmake-build-release --config Release

      - name: Restore NuGet packages
        run: |
          nuget restore Wemod-Patcher.sln

      - name: Build solution in Release mode
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile .NET app
        run: |
          msbuild Wemod-Patcher.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Prepare artifact
        run: |
          $artifactDir = "artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item "WeModPatcher\bin\Release\WeModPatcher.exe" "$artifactDir\WandEnhancer.exe" -Force

          Get-ChildItem "WeModPatcher\bin\Release\*.dll" | ForEach-Object {
            Copy-Item $_.FullName $artifactDir -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Windows
          path: artifact/
