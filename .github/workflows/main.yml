name: Build executable

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build CMake helper DLL
        run: |
          cmake -S tools/asar-fuses-bypass -B tools/asar-fuses-bypass/cmake-build-release -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/asar-fuses-bypass/cmake-build-release --config Release

      - name: Restore NuGet packages
        run: |
          nuget restore Wemod-Patcher.sln

      - name: Build solution in Release mode
        run: |
          msbuild Wemod-Patcher.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Prepare artifact folder
        run: |
          $artifactDir = "artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item "WeModPatcher\bin\Release\WeModPatcher.exe" "$artifactDir\WandEnhancer.exe" -Force

          Get-ChildItem "WeModPatcher\bin\Release\*.dll" | ForEach-Object {
            Copy-Item $_.FullName $artifactDir -Force
          }

          $configFiles = Get-ChildItem "WeModPatcher\bin\Release\*.config" -ErrorAction SilentlyContinue
          if ($configFiles) {
            $configFiles | ForEach-Object {
              Copy-Item $_.FullName $artifactDir -Force
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Windows
          path: artifact/
